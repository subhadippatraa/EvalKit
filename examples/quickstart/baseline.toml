# Score the outputs already stored in the dataset (the "precomputed" target).
[target]
kind = "precomputed"

[[evaluators]]
kind = "exact_match"
name = "answer"
params = { normalize = ["strip"] }

[[evaluators]]
kind = "regex"
name = "is_number"
params = { pattern = "^[0-9]+$", mode = "fullmatch" }

[policy]
concurrency = 4
seed = 1

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests with branch coverage
        # the floor (fail_under) lives in pyproject.toml; a change that drops coverage below it fails
        run: |
          uv run --with coverage coverage run -m pytest -q
          uv run --with coverage coverage report

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      # No type-check step: the repository has no type-checker configuration or typing strategy, and
      # adding one only to satisfy a checklist would prove nothing (docs/DECISIONS.md, DR-12).

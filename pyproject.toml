[project]
name = "evalkit"
version = "0.1.0"
description = "Small, reusable LLM-as-judge evaluation library and CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "boto3>=1.35",
]

[project.scripts]
evalkit = "evalkit.cli:main"

[project.optional-dependencies]
bedrock-openai = [
    "openai>=1.50",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "openai>=1.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.format]
exclude = ["*.md"]

[project]
name = "evalkit"
version = "0.2.0"
description = "Small, reusable LLM-as-judge evaluation library and CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "boto3>=1.35",
]

[project.scripts]
evalkit = "evalkit.cli:main"

[project.optional-dependencies]
bedrock-openai = [
    "openai>=1.50",
]
# the `json_schema` evaluator; the core stays on pydantic + boto3 only
jsonschema = [
    "jsonschema>=4.20",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "openai>=1.50",
    "hypothesis>=6.168.1",
    "jsonschema>=4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/evalkit"]

[tool.coverage.report]
# A floor, not a target: coverage counts executed lines, not behaviours (the mutation suite and the
# end-to-end regression tests are what check behaviour). 98% at P1.1; the floor leaves room for
# honest churn but fails a change that adds untested code wholesale.
fail_under = 97
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/mutation.py" = ["E501"]  # a table of one-line mutants

[tool.ruff.format]
exclude = ["*.md"]
